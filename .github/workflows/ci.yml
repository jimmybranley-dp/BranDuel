name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium and required system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run canonical verification
        run: npm run verify:full -- --full-matrix

      - name: Upload sanitized diagnostic and browser artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: branduel-verification-${{ github.run_attempt }}
          path: |
            diagnostics/branduel-event-rehearsal.json
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14
